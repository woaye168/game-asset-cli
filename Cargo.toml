[package]
name = "game-asset-cli"
version = "0.1.0"
edition = "2021"
description = "AI 生成的游戏资源加工 CLI 工具（音频 / 图像批处理），单文件独立运行"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tga", "ico", "pnm"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "flac", "wav", "aac", "isomp4"] }
rubato = "0.16"
hound = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
