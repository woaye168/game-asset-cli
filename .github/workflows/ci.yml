name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust check
        run: cargo check

      - name: Rust clippy
        run: cargo clippy -- -D warnings

      - name: Rust test
        run: cargo test
